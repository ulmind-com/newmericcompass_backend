# Render.com blueprint (native Python + uv runtime).
# Import this repo as a Blueprint, then fill in the secret env vars.
services:
  - type: web
    name: newmericcompass-backend
    runtime: python
    plan: free
    buildCommand: "uv sync --frozen --no-dev"
    # Binds to 0.0.0.0:$PORT so Render can detect the open port.
    startCommand: "uv run python main.py"
    healthCheckPath: /ping
    autoDeploy: true
    envVars:
      - key: MONGODB_URL
        sync: false
      - key: DATABASE_NAME
        value: newmericcompass
      - key: SECRET_KEY
        generateValue: true
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
